<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST" action="processar_modelo.php">
    <input type="text" name="titulo" placeholder="Título do Modelo" required>
    
    <div id="container-campos">
        </div>
    
    <button type="button" onclick="adicionarCampo()">+ Adicionar Campo</button>
    <button type="submit">Salvar Modelo</button>
</form>

<script>
let count = 0;
function adicionarCampo() {
    if (count < 12) {
        const div = document.createElement('div');
        div.innerHTML = `
            <input type="text" name="campo_nome_${count}" placeholder="Nome do campo" required>
            <select name="campo_tipo_${count}">
                <option value="str">Texto</option>
                <option value="float">Float</option>
                <option value="int">Int</option>
                <option value="boolean">Boolean</option>
                <option value="date">Data</option>
            </select>
            <input type="checkbox" name="campo_obrigatorio_${count}"> Obrigatório
        `;
        document.getElementById('container-campos').appendChild(div);
        count++;
    } else {
        alert("Limite de 12 campos atingido!");
    }
}
</script>
    
</body>
</html>
